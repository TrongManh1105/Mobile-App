services:
  - type: web
    name: voice-food-app
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "python -m app.infrastructure.db.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONPATH
        value: backend
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./food_app.db
      - key: PYTHONUNBUFFERED
        value: "1"
    plan: free
